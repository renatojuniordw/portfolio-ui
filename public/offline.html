<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Sem conexão — Renato Bezerra</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #f5f5f5;
      --text: #111111;
      --text-2: #555555;
      --btn-bg: #111111;
      --btn-text: #ffffff;
      --focus: #1d4ed8;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0a0a0a;
        --text: #f5f5f5;
        --text-2: #a3a3a3;
        --btn-bg: #f5f5f5;
        --btn-text: #0a0a0a;
        --focus: #60a5fa;
      }
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 1.5rem;
      line-height: 1.6;
    }
    main { text-align: center; max-width: 28rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin-bottom: 0.75rem; }
    p { color: var(--text-2); margin-bottom: 1rem; }
    .actions { display: flex; flex-wrap: wrap; gap: 0.75rem; justify-content: center; margin-top: 1.5rem; }
    a, button {
      display: inline-flex;
      align-items: center;
      min-height: 2.75rem;
      padding: 0 1.5rem;
      border-radius: 999px;
      font: inherit;
      font-size: 0.9375rem;
      font-weight: 500;
      text-decoration: none;
      cursor: pointer;
    }
    button { background: var(--btn-bg); color: var(--btn-text); border: 0; }
    a { color: var(--text); border: 1px solid currentColor; }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <h1>Sem conexão</h1>
    <p>Não foi possível carregar esta página porque o dispositivo está sem internet.</p>
    <p>O portfólio precisa de conexão para abrir as páginas. Verifique sua rede e tente novamente.</p>
    <div class="actions">
      <button type="button" onclick="location.reload()">Tentar novamente</button>
      <a href="/">Ir para o início</a>
    </div>
  </main>
</body>
</html>
